[project]
name = "dvd-rental-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soheil mansoori", email = "soheil.mansoori.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi-offline>=1.7.7",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
dvd-rental-api = "dvd_rental_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
